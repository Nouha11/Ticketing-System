services:

  api:
    image: nouhah/ticketing-api:latest
    container_name: api_container
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Data Source=/app/data/ticketing.db"
      Jwt__Key: "super-secret-key-change-this-in-production-min32chars!"
      Jwt__Issuer: "TicketingApi"
      Jwt__Audience: "TicketingApp"
    volumes:
      - db-data:/app/data
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/api/tickets -o /dev/null -w '%{http_code}' | grep -qE '200|401' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: nouhah/ticketing-frontend:latest
    container_name: frontend_container
    restart: unless-stopped
    ports:
      - "0.0.0.0:4200:80"
    networks:
      - ticketing-network
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:

networks:
  ticketing-network:
    driver: bridge
