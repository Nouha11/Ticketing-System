apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ticketing-system-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: Jwt__Key
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: jwt-key }
            - name: Jwt__Issuer
              value: "TicketingApi"
            - name: Jwt__Audience
              value: "TicketingApp"
            - name: LlmApiKey
              valueFrom:
                secretKeyRef: { name: ticketing-secrets, key: llm-api-key }
          volumeMounts:
            - name: db-data
              mountPath: /data
      volumes:
        - name: db-data
          hostPath:
            path: /var/ticketing-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ticketing-system-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
